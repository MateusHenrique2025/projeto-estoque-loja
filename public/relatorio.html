<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatório - Sistema de Estoque</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="topo">
    <h1>Relatório do estoque</h1>
    <p class="sub">Totais e produtos com estoque baixo</p>
    <nav id="menu" class="menu" aria-label="Telas do sistema" hidden></nav>
  </header>

  <main class="conteudo">
    <p id="aviso" class="aviso" role="status" hidden></p>

    <section class="cartao">
      <h2>Resumo</h2>
      <table>
        <tbody>
          <tr><th>Produtos cadastrados</th><td class="num" id="r-produtos">—</td></tr>
          <tr><th>Total de unidades</th><td class="num" id="r-unidades">—</td></tr>
          <tr><th>Valor do estoque</th><td class="num" id="r-valor">—</td></tr>
        </tbody>
      </table>
    </section>

    <section class="cartao">
      <h2 id="titulo-baixo">Produtos com estoque baixo</h2>
      <div class="rolagem">
        <table>
          <thead><tr><th>Código</th><th>Nome</th><th>Categoria</th><th>Quantidade</th></tr></thead>
          <tbody id="baixo"></tbody>
        </table>
      </div>
      <p id="vazio" class="vazio" hidden>Nenhum produto com estoque baixo.</p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="relatorio.js"></script>
</body>
</html>
